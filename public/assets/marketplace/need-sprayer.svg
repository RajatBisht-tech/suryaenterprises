    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD866"/><stop offset="1" stop-color="#E0A800"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4E9E6"/><stop offset="1" stop-color="#9AA6A0"/></linearGradient>
    <clipPath id="c"><circle cx="80" cy="80" r="80"/></clipPath>
  </defs>
