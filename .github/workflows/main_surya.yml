# Docs for Azure Web Apps Deploy:
# https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - surya

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build --if-present

      - name: Run tests
        run: npm run test --if-present

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            .
            !node_modules/**
            !.git/**
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-24.04
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_748D93F18CC341BB8FF8ED631E92BEBF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B539E970D8CA40E6A15325B7034A0C06 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6A9CA559ABB1423E8F67572791DF258A }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: surya
          slot-name: Production
          package: .
