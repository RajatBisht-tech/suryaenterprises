name: Build and deploy Node.js app to Azure Web App - surya

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Prepare standalone release bundle
        run: |
          # Copy public and static assets into the standalone directory
          cp -r public .next/standalone/ || true
          cp -r .next/static .next/standalone/.next/
          
          # Zip only the standalone bundle
          cd .next/standalone
          zip -r ../../release.zip .
          cd ../..

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: release-package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_748D93F18CC341BB8FF8ED631E92BEBF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B539E970D8CA40E6A15325B7034A0C06 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6A9CA559ABB1423E8F67572791DF258A }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'surya'
          slot-name: 'Production'
          package: release.zip
